services:
  seo_api:
    network_mode: host
    build: ./app
    container_name: seo_api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app

  postgres:
    image: postgres:16
    container_name: seo_api_postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: seo_api
      POSTGRES_DB: seoapi
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=4096"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  postgres_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /www/SeoApi/data/postgres_data  # 指定外部的路径
